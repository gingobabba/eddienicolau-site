<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 80" fill="#1A1A1A">
  <!-- House/W mark -->
  <g transform="translate(0, 4)">
    <!-- Left peak -->
    <polygon points="18,38 32,14 46,38" />
    <!-- Right peak -->
    <polygon points="40,38 54,14 68,38" />
    <!-- Base rectangle -->
