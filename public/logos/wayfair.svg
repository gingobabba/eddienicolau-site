    <!-- Door cutout -->
    <rect x="34" y="48" width="16" height="18" fill="#F4EFE4" />
  </g>
  <!-- Wordmark -->
  <text x="86" y="56" font-family="Georgia, serif" font-size="34" font-weight="700" letter-spacing="-0.5">Wayfair</text>
</svg>
